name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck

      - name: Shellcheck
        run: shellcheck scripts/tmux-attention scripts/clear-after-delay scripts/install-hooks scripts/setup tests/check.sh tmux-attention.tmux

      - name: Run tests
        run: tests/check.sh
